name: Deploy Staging (Test)

on:
  push:
    branches: [staging]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build Astro
        run: npm run build
        env:
          # O subdominio staging.camargogallo.com.br tem como raiz o
          # diretorio do deploy (/public_html/staging/), entao o build usa
          # base '/' (assets em /_astro, links /portfolio) e a API fica em
          # /api. Com base '/staging/' os assets caem em /staging/_astro
          # (404) e os links ficam com o prefixo duplicado.
          BASE_PATH: /
          SITE_URL: http://staging.camargogallo.com.br
          PUBLIC_API_BASE: /api

      - name: Deploy Admin Panel to Staging
        run: node deploy-ftp.cjs admin staging/admin

      - name: Deploy Backend API to Staging
        run: node deploy-ftp.cjs api staging/api

      - name: Deploy Frontend to Staging
        run: node deploy-ftp.cjs dist staging

      # O deploy sobe arquivos e nao apaga os que ficaram de versoes
      # anteriores. Esses probes nao devem continuar no servidor.
      - name: Remove stale files from Staging API
        run: node deploy-ftp-clean.cjs staging/api _itest.php _gen.php _diag.php _selftest.php _t1.php _t2.php _t3.php register.php debug.php debug2.php test_db.php
